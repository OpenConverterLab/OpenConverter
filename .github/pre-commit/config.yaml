repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
    - id: check-case-conflict
    - id: check-executables-have-shebangs
    - id: check-illegal-windows-names
    - id: check-yaml
    - id: end-of-file-fixer
    - id: file-contents-sorter
      files:
        .github/pre-commit/ignored-words.txt
      args:
        - --ignore-case
    - id: fix-byte-order-marker
    - id: mixed-line-ending
    - id: trailing-whitespace
- repo: https://github.com/codespell-project/codespell
  rev: v2.4.1
  hooks:
    - id: codespell
      args:
        - --ignore-words=.github/pre-commit/ignored-words.txt
        - --ignore-multiline-regex=codespell:off.*?(codespell:on|\Z)
      exclude: ^tools/(patcheck|clean-diff)$
- repo: local
  hooks:
    - id: check-license-header
      name: check Apache-2.0 license header
      entry: python3 .github/pre-commit/check_license_header.py
      language: system
      files: \.(cpp|h|py|sh)$
